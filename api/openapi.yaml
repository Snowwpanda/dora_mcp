swagger: "2.0"
info:
  title: DORA Publications API
  description: >
    REST API for searching the DORA (Digital Object Repository for Academia) database.
    Provides endpoints for searching scientific publications by keywords or author names,
    health checks, and tool discovery.
    For Microsoft Copilot Studio integration use the MCP endpoint at /mcp with
    the openapi-copilot-studio.yaml specification.
  version: "1.0.0"
host: localhost
basePath: /
schemes:
  - https
  - http
consumes:
  - application/json
produces:
  - application/json
paths:
  /health:
    get:
      summary: Health check
      description: Check if the service is running and healthy.
      operationId: healthCheck
      responses:
        200:
          description: Service is healthy
          schema:
            type: object
            properties:
              status:
                type: string
                example: healthy
              service:
                type: string
                example: dora-mcp
              transport:
                type: string
                example: http-streamable
  /tools:
    get:
      summary: List available MCP tools
      description: Get a list of all available MCP tools with their descriptions and input schemas.
      operationId: listTools
      responses:
        200:
          description: List of available tools
          schema:
            type: object
            properties:
              tools:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      example: search_publications
                    description:
                      type: string
                    inputSchema:
                      type: object
  /api/search:
    post:
      summary: Search DORA publications (REST API)
      description: >
        Search for scientific publications in the DORA database.
        Use SHORT KEYWORDS or AUTHOR NAMES, not full sentences.
        Good: "manfred heuberger", "polymer coating", "tribology".
      operationId: searchPublications
      parameters:
        - name: body
          in: body
          required: true
          description: Search request
          schema:
            type: object
            required:
              - search_string
            properties:
              search_string:
                type: string
                description: Short search keywords or author name (1-3 keywords)
                example: climate change
      responses:
        200:
          description: Search results
          schema:
            type: object
            properties:
              search_string:
                type: string
              total:
                type: integer
              results:
                type: object
        400:
          description: Bad request - missing search_string
          schema:
            type: object
            properties:
              error:
                type: string
        500:
          description: Internal server error
          schema:
            type: object
            properties:
              error:
                type: string
  /api/abstract:
    post:
      summary: Retrieve publication abstract (REST API)
      description: >
        Fetch the abstract and metadata for a specific DORA publication.
        Provide either a full publication URL or just the identifier.
      operationId: getPublicationAbstract
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            required:
              - identifier_or_url
            properties:
              identifier_or_url:
                type: string
                description: Full DORA URL or publication identifier
                example: empa:27842
      responses:
        200:
          description: Publication abstract
          schema:
            type: object
            properties:
              publication_id:
                type: string
              url:
                type: string
              abstract_text:
                type: string
              abstract_html:
                type: string
              error:
                type: string
        400:
          description: Bad request - missing identifier_or_url
          schema:
            type: object
            properties:
              error:
                type: string
        500:
          description: Internal server error
          schema:
            type: object
            properties:
              error:
                type: string

  /mcp:
    get:
      summary: MCP endpoint information
      description: Get information about the MCP endpoint, protocol version, and available tools.
      operationId: mcpInfo
      responses:
        200:
          description: MCP endpoint information
          schema:
            type: object
            properties:
              message:
                type: string
              version:
                type: string
              description:
                type: string
              usage:
                type: object
              available_tools:
                type: array
                items:
                  type: object
    post:
      summary: MCP Streamable endpoint (JSON-RPC 2.0)
      description: >
        MCP Streamable endpoint using JSON-RPC 2.0 protocol.
        Supported methods: initialize, tools/list, tools/call.
        Tools available: search_publications, get_publication_abstract.
      operationId: invokeMCP
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            required:
              - jsonrpc
              - method
            properties:
              jsonrpc:
                type: string
                enum:
                  - "2.0"
                description: JSON-RPC version
              id:
                type: integer
                description: Request ID
              method:
                type: string
                enum:
                  - initialize
                  - tools/list
                  - tools/call
                description: MCP method to call
              params:
                type: object
                description: Method parameters
      responses:
        200:
          description: JSON-RPC 2.0 response
          schema:
            type: object
            properties:
              jsonrpc:
                type: string
              id:
                type: integer
              result:
                type: object
              error:
                type: object
